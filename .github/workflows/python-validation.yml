name: Python validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests and Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: python -m ruff check src tests
      - name: Ruff format
        run: python -m ruff format --check src tests
      - name: Test public suite and report optional skips
        run: python -m pytest -q -ra

  installed-core:
    name: Installed core and distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install validation tools
        run: python -m pip install build 'pytest>=9.1.1'
      - name: Build wheel and sdist
        run: python -m build
      - name: Verify distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          wheel, = Path('dist').glob('*.whl')
          sdist, = Path('dist').glob('*.tar.gz')
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              assert 'legal_chunking/extract/pymupdf4llm_worker.py' in names
              assert any('/assets/normalization_policy/' in name for name in names)
              assert not any('.develop' in Path(name).parts for name in names)
          with tarfile.open(sdist) as archive:
              names = archive.getnames()
              assert any(name.endswith('/docs/quality.md') for name in names)
              assert not any('.develop' in Path(name).parts for name in names)
          PY
      - name: Install wheel without optional dependencies
        run: python -m pip install --no-deps dist/*.whl
      - name: Check installed core isolation
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          import legal_chunking

          assert not Path(legal_chunking.__file__).resolve().is_relative_to(
              Path(os.environ['GITHUB_WORKSPACE']).resolve()
          )
          for name in ('pymupdf', 'fitz', 'pymupdf4llm'):
              assert importlib.util.find_spec(name) is None, name
          PY
      - name: Test installed text and reference contracts outside checkout
        working-directory: ${{ runner.temp }}
        run: >-
          python -m pytest "$GITHUB_WORKSPACE/tests/test_quality_contracts.py"
          "$GITHUB_WORKSPACE/tests/test_references.py"
          "$GITHUB_WORKSPACE/tests/test_reference_occurrences.py"
          -k 'not noisy_native_pdf' -q -ra
      - name: Check installed console entrypoint
        working-directory: ${{ runner.temp }}
        run: |
          legal-chunking chunk --text 'Article 1. Scope' > core.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('core.json').read_text())
          assert payload['chunks'][0]['text'] == 'Article 1. Scope'
          PY
